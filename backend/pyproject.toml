[project]
name = "smarthireai-backend"
version = "1.0.0"
description = "SmartHireAI Enterprise AI-Powered Placement Intelligence Backend Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.4",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "spacy>=3.7.4",
    "sentence-transformers>=2.6.1",
    "xgboost>=2.0.3",
    "shap>=0.45.0",
    "faiss-cpu>=1.8.0",
    "google-genai>=0.1.1",
    "pyjwt[crypto]>=2.8.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",    
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests/unit/test_health.py", "tests/unit/test_auth_service.py", "tests/unit/test_resume_parser.py", "tests/integration/test_auth_routes.py", "tests/integration/test_resume_routes.py", "tests/integration/test_db_connection.py"]
asyncio_mode = "auto"
